<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Subliminally by FTHR</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --midnight:#0D0B18; --midnight-2:#12101F; --veil:#1C1830; --dusk:#262040;
    --moonlight:#EDE9F6; --haze:#9C93B8; --candle:#E3BE7F; --lilac:#B9A7E8;
    --serif:'Fraunces', Georgia, serif; --sans:'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--midnight); color:var(--moonlight); font-family:var(--sans); font-weight:300; line-height:1.6; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card{ width:100%; max-width:400px; margin:24px; background:var(--veil); border:1px solid var(--dusk); border-radius:20px; padding:32px 28px; }
  .brand{ font-family:var(--serif); font-size:20px; margin-bottom:4px; }
  .brand span{ color:var(--haze); font-weight:300; font-size:14px; }
  h1{ font-family:var(--serif); font-size:22px; margin:18px 0 8px; }
  p.sub{ font-size:13.5px; color:var(--haze); margin-bottom:22px; }
  label{ display:block; font-size:12.5px; color:var(--haze); margin-bottom:6px; }
  input{ width:100%; background:var(--midnight-2); border:1px solid var(--dusk); border-radius:10px; padding:11px 14px; color:var(--moonlight); font-family:inherit; font-size:14px; margin-bottom:16px; }
  input:focus{ outline:none; border-color:var(--lilac); }
  button{ width:100%; background:var(--candle); color:#241C0E; border:none; border-radius:999px; padding:12px 20px; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; transition:transform .2s; }
  button:hover{ transform:translateY(-1px); }
  button:disabled{ opacity:.6; cursor:default; transform:none; }
  .msg{ font-size:13px; margin-top:14px; min-height:18px; }
  .msg.err{ color:#E39A9A; }
  .msg.ok{ color:#9ADBB0; }
  a.back{ display:inline-block; margin-top:20px; color:var(--lilac); font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Subliminally <span>by FTHR</span></div>
  <h1 id="title">Set a new password</h1>
  <p class="sub" id="sub">Choose a new password for your account.</p>

  <div id="formWrap">
    <label for="pw">New password</label>
    <input type="password" id="pw" placeholder="••••••••" autocomplete="new-password">
    <label for="pw2">Confirm password</label>
    <input type="password" id="pw2" placeholder="••••••••" autocomplete="new-password">
    <button id="submitBtn" onclick="submitNewPassword()">Update password</button>
  </div>

  <div class="msg" id="msg"></div>
  <a class="back" href="/" id="backLink" style="display:none;">← Back to Subliminally</a>
</div>

<script>
const SUPABASE_URL = 'https://eiqylxcgexndzopesvhd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1g7zbin7PEQhi2e0Y-QM8Q_-0TAfubb';
// Same flow type and storage key as the main site, so the PKCE verifier written
// when the reset was requested is the one found here.
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' },
});

const msgEl = document.getElementById('msg');

function refuse(text){
  msgEl.textContent = text;
  msgEl.className = 'msg err';
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('backLink').style.display = 'inline-block';
}

/* A recovery link can arrive in three shapes, and only one of them used to be
   handled. `token_hash` is the one that survives being opened in a mail app's
   browser instead of the one that asked for the reset — there is no PKCE
   verifier to match — so it is tried first. */
(async function openRecovery(){
  const query = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  const pick = (key) => query.get(key) || hash.get(key);

  const errorCode = pick('error') || pick('error_code');
  if (errorCode){
    refuse('This link has expired or has already been used — go back and request a new one.');
    return;
  }

  const tokenHash = pick('token_hash');
  if (tokenHash){
    const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type: pick('type') || 'recovery' });
    if (error){
      refuse('This link has expired or has already been used — go back and request a new one.');
      return;
    }
    history.replaceState(null, '', window.location.pathname);
    return;
  }

  // Otherwise supabase-js has already had its go at the URL: either it found an
  // access token in the fragment, or it exchanged a code it had the verifier for.
  const { data } = await sb.auth.getSession();
  if (!data.session){
    refuse(query.get('code')
      ? "This link was opened in a different browser than the one that asked for the reset, so we can't use it here. Open it in that browser, or request a new one."
      : 'This link is invalid or has expired — go back and request a new one.');
    return;
  }
  history.replaceState(null, '', window.location.pathname);
})();

async function submitNewPassword(){
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (!pw || pw.length < 6){ msgEl.textContent = 'Use at least 6 characters.'; msgEl.className = 'msg err'; return; }
  if (pw !== pw2){ msgEl.textContent = "Passwords don't match."; msgEl.className = 'msg err'; return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  msgEl.textContent = 'Updating…'; msgEl.className = 'msg';

  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false;
  if (error){
    msgEl.textContent = error.message || 'Something went wrong — try again.';
    msgEl.className = 'msg err';
    return;
  }

  document.getElementById('title').textContent = "You're all set";
  document.getElementById('sub').textContent = 'Your password has been updated.';
  document.getElementById('formWrap').style.display = 'none';
  msgEl.textContent = 'Head back and log in with your new password — on the web or in the app.';
  msgEl.className = 'msg ok';
  document.getElementById('backLink').style.display = 'inline-block';
}
</script>
</body>
</html>
